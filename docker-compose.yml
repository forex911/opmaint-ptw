services:
  postgres:
    image: postgres:16-alpine
    container_name: ptw_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ptw_cmms
    ports:
      - "5432:5432"
    volumes:
      - ptw_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ptw_cmms"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ptw_pgdata:
